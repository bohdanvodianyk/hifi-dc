# 10-scene diagnostic set (data/test/, kept out of git). One entry per scene.
#   to_metres            native unit -> metres, used only to feed the method (its hyper-parameters
#                        assume metres). Metrics stay in native units, per scene.
#   invalid_at_or_above  sentinel / far cap removed from BOTH sparse input and GT (null = none).
#   invalid_below        optional lower validity limit (native units), applied to sparse and GT.
#   intrinsics           optional [fx, fy, cx, cy] in native image pixels (standard dataset calibration);
#                        absent = unknown -> 60-degree horizontal FOV (Hypersim, Sintel, VOID).
#   unit_uncertain       the unit is a guess; report scale-free AbsRel / delta1 / si-log as headline.
# Sources are inferred from file names and value ranges, not verified labels.
